<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>EVA Trainer - Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #info {
      position: absolute;
      top: 10px;
      width: 100%;
      text-align: center;
      color: white;
      font-family: sans-serif;
      font-size: 14px;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div id="info">EVA Trainer — prototype 1 : arène + tir + cible</div>

  <div id="menu" style="
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #101018; color: white; font-family: sans-serif; gap: 20px;">
    <h1 style="font-size: 22px; font-weight: 500;">EVA Trainer</h1>
    <p style="color: #aaa; font-size: 14px;">Choisis un mode pour commencer</p>
    <div style="display: flex; gap: 16px;">
      <button id="btn-pc" style="padding: 14px 28px; font-size: 16px; cursor: pointer;">Mode PC</button>
      <button id="btn-vr" style="padding: 14px 28px; font-size: 16px; cursor: pointer;">Mode VR (Pico 4)</button>
    </div>
    <p id="menu-msg" style="color: #e24b4a; font-size: 13px; min-height: 18px;"></p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./main.js"></script>
</body>
</html>
